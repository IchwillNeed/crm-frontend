<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Forma base del pétalo -->
    <path id="petalo" d="M 44,44 C 22,22 10,35 15,50 C 19,64 35,62 44,44 Z" />
  </defs>

  <!-- Pétalos izquierdos (Naranja) -->
  <use href="#petalo" fill="#FF6B35" />
  <use href="#petalo" transform="rotate(-90 50 50)" fill="#FF6B35" />
  
  <!-- Pétalos derechos (Rojo) -->
  <use href="#petalo" transform="rotate(90 50 50)" fill="#EE3E38" />
  <use href="#petalo" transform="rotate(180 50 50)" fill="#EE3E38" />
</svg>